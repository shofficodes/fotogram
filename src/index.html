<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="icon" href="../assets/img/header/favicon.svg">

    <link rel="stylesheet" href="./css/standart.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body onload="init(); window.scrollTo(0, 0)">
    <main>
        <header>
            <nav aria-label="Hauptnavigation">
                <a href="./index.html">
                    <img src="../assets/img/header/logo_with_text.svg" alt="fotogram_logo">
                </a>
            </nav>
        </header>

        <article>
            <header>
                <h1>Your personal photo album</h1>
            </header>

            <section class="content_area" id="content_area" aria-labelledby="gallery-heading">
                <!-- Diese Sekiton wird in ./js/renderContent.js erstellt! -->
            </section>

            <section class="dialog_area" id="dialog_area">
                <!-- Diese Sektion wird in ./js/renderDialog.js erstellt! -->
            </section>
        </article>

        <footer>
            <div class="footer_inner">
                <a href="https://developerakademie.com/" target="_blank">
                    <img src="../assets/img/footer/da_logo_with_text.svg" alt="Developer_Akademie_Logo">
                </a>
                <p>© 2023 Developer Akademie GmbH</p>
            </div>
        </footer>
    </main>

    <script src="./js/renderThumbnails.js"></script>
    <script src="./js/renderDialog.js"></script>

    <script>
        function init() {
            renderThumbnails();
            renderDialog();
            enableDialogOutsideClickClose();
        }
    </script>
</body>

</html>
